[workspace]
members = [".", "testkit"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Ahmed Semih Özmekik"]
repository = "https://github.com/aozmekik/gguf-inspect"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Accessor-style APIs make this lint noisy without catching real bugs.
must_use_candidate = "allow"
# `gguf_inspect::metadata::MetadataValue` reads better than `metadata::Value` at call sites.
module_name_repetitions = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[package]
name = "gguf-inspect"
version = "0.1.0"
description = "Inspect GGUF model files (llama.cpp / ggml format) without loading tensor data"
readme = "README.md"
keywords = ["gguf", "ggml", "llama-cpp", "llm", "cli"]
categories = ["command-line-utilities", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["cli"]
# Everything needed by the `gguf-inspect` binary. Library users can opt out with
# `default-features = false`; the library itself has no dependencies.
cli = ["dep:clap", "dep:serde", "dep:serde_json", "dep:unicode-width"]

[dependencies]
clap = { version = "4.6", features = ["derive", "wrap_help"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
unicode-width = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
dhat = "0.3"
gguf-testkit = { path = "testkit" }
insta = "1.49"
proptest = "1.12"
tempfile = "3.27"

[[bin]]
name = "gguf-inspect"
path = "src/bin/gguf-inspect/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
