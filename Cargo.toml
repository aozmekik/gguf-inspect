[workspace]
members = ["."]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Ahmed Semih Özmekik"]
repository = "https://github.com/aozmekik/gguf-inspect"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Accessor-style APIs make this lint noisy without catching real bugs.
must_use_candidate = "allow"
# `gguf_inspect::metadata::MetadataValue` reads better than `metadata::Value` at call sites.
module_name_repetitions = "allow"
dbg_macro = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"

[package]
name = "gguf-inspect"
version = "0.1.0"
description = "Inspect GGUF model files (llama.cpp / ggml format) without loading tensor data"
readme = "README.md"
keywords = ["gguf", "ggml", "llama-cpp", "llm", "cli"]
categories = ["command-line-utilities", "parser-implementations"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
