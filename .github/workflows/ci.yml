name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format, lint, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (library only, no default features)
        run: cargo clippy -p gguf-inspect --lib --no-default-features --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: Test library without default features
        run: cargo test -p gguf-inspect --lib --no-default-features --locked
      - run: cargo build --release --locked
      - name: Run examples and the CLI on a synthetic model
        shell: bash
        run: |
          cargo run --locked --example synth -- "$RUNNER_TEMP/tiny.gguf"
          cargo run --locked --example summary -- "$RUNNER_TEMP/tiny.gguf"
          cargo run --locked --example summary
          ./target/release/gguf-inspect info "$RUNNER_TEMP/tiny.gguf"
          ./target/release/gguf-inspect kv-cache "$RUNNER_TEMP/tiny.gguf" --ctx 4096 --cache-type q8_0

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  extras:
    name: Fuzz target, benchmarks, ggml type table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Fuzz target compiles
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Benchmarks compile
        run: cargo bench --no-run --locked
      - name: Type table matches ggml's block structs
        run: ./scripts/check-ggml-type-sizes.sh
